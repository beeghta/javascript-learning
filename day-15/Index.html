<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Dashboard</title>
</head>

<body>

    <h1>Neuron Dashboard</h1>

    <form id="neuronForm">

        <input id="neuronName"
               type="text"
               placeholder="Neuron name">

        <input id="activityInput"
               type="number"
               step="0.01"
               min="0"
               max="1"
               placeholder="Activity">

        <button type="submit">
            Add Neuron
        </button>

    </form>

    <div id="neurons"></div>

    <script src="script.js"></script>

</body>
</html>
