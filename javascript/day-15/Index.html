<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Dashboard</title>
</head>
<body>
    <h1>Neuron Dashboard</h1>

    <form id="neuronForm">
        <label for="neuronName">Neuron name</label>
        <input id="neuronName"
               type="text"
               placeholder="Neuron name">

        <label for="activityInput">Activity (0 - 1)</label>
        <input id="activityInput"
               type="number"
               step="0.01"
               min="0"
               max="1"
               placeholder="Activity">

        <button type="submit">Add Neuron</button>

        <p id="errorMessage" role="alert" style="color: red;"></p>
    </form>

    <div id="neurons"></div>

    <script src="script.js"></script>
</body>
</html>
